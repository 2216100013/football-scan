<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>777 扫盘中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0a0e1a;--card:#111827;--b:#1f2937;--t:#e5e7eb;--s:#9ca3af;--a:#3b82f6;--win:#10b981;--loss:#ef4444;--push:#f59e0b;--heart:#f43f5e}body{background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}.header{background:rgba(17,24,39,.8);border-bottom:1px solid var(--b);padding:16px 24px;position:sticky;top:0}.hi{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}.logo{display:flex;align-items:center;gap:12px}.li{width:40px;height:40px;background:var(--a);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}.lt h1{font-size:18px}.lt span{font-size:12px;color:var(--s)}.hs{display:flex;gap:24px}.si{text-align:center}.sv{font-size:20px;font-weight:700;color:var(--win)}.sv.l{color:var(--loss)}.sv.p{color:var(--push)}.sl{font-size:11px;color:var(--s)}.ctrl{max-width:1200px;margin:24px auto;padding:0 24px;display:flex;gap:12px}.fb{padding:8px 16px;border-radius:8px;border:1px solid var(--b);background:var(--card);color:var(--t);cursor:pointer}.fb:hover,.fb.a{border-color:var(--a);background:rgba(59,130,246,.2)}.main{max-width:1200px;margin:0 auto;padding:0 24px 48px}.st{font-size:14px;color:var(--s);margin-bottom:16px}.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}.mc{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:20px;position:relative;overflow:hidden}.mc:hover{border-color:var(--a)}.mc.hrt{border-color:var(--heart);box-shadow:0 0 20px rgba(244,63,94,.3)}.mc.hrt::before{content:'重心胆';position:absolute;top:12px;right:-28px;background:var(--heart);color:#fff;font-size:11px;font-weight:700;padding:4px 32px;transform:rotate(45deg)}.mh{display:flex;justify-content:space-between;margin-bottom:16px}.mm{display:flex;gap:8px;align-items:center}.mt{font-size:12px;color:var(--s);background:rgba(255,255,255,.05);padding:4px 8px;border-radius:4px}.ml{font-size:11px;color:var(--a);font-weight:600}.bd{padding:4px 12px;border-radius:6px;font-size:12px;font-weight:700}.bd.w{background:rgba(16,185,129,.15);color:var(--win)}.bd.l{background:rgba(239,68,68,.15);color:var(--loss)}.bd.p{background:rgba(245,158,11,.15);color:var(--push)}.bd.d{background:rgba(156,163,175,.15);color:var(--s)}.tm{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.tm .t{display:flex;align-items:center;gap:10px;flex:1}.tm .t.r{flex-direction:row-reverse;text-align:right}.tl{width:36px;height:36px;background:rgba(255,255,255,.05);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}.tn{font-size:14px;font-weight:600}.sc{font-size:24px;font-weight:700;text-align:center;min-width:80px}.pd{background:rgba(255,255,255,.03);border-radius:8px;padding:12px;margin-bottom:12px}.pt{font-size:11px;color:var(--s);margin-bottom:8px}.pc{display:flex;gap:8px;flex-wrap:wrap}.tg{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:600}.tg.m{background:rgba(59,130,246,.3);color:var(--a);border:1px solid var(--a)}.tg.c{background:rgba(255,255,255,.05);color:var(--s)}.tg.o{background:rgba(16,185,129,.1);color:var(--win)}.rv{border-top:1px solid var(--b);padding-top:12px}.rt{font-size:11px;color:var(--s);margin-bottom:8px}.rx{font-size:13px;line-height:1.6;color:var(--s)}.ft{text-align:center;padding:32px;color:var(--s);font-size:12px;border-top:1px solid var(--b)}@media(max-width:768px){.mg{grid-template-columns:1fr}.hs{display:none}}
</style>
</head>
<body>
<header class="header"><div class="hi"><div class="logo"><div class="li">⚽</div><div class="lt"><h1>777 扫盘中心</h1><span>Football Scan & Review</span></div></div><div class="hs"><div class="si"><div class="sv" id="w">0</div><div class="sl">命中</div></div><div class="si"><div class="sv l" id="l">0</div><div class="sl">黑掉</div></div><div class="si"><div class="sv p" id="p">0</div><div class="sl">走水</div></div><div class="si"><div class="sv" id="r">0%</div><div class="sl">命中率</div></div></div></div></header>
<div class="ctrl"><button class="fb a" onclick="f('all')">全部</button><button class="fb" onclick="f('heart')">重心胆</button><button class="fb" onclick="f('win')">命中</button><button class="fb" onclick="f('loss')">黑掉</button><button class="fb" onclick="f('today')">今日</button></div>
<main class="main"><div class="st">📋 2026-05-11 复盘 + 05-12 推荐</div><div class="mg" id="g"></div></main>
<div class="ft">777 扫盘系统 | 数据驱动决策 | 理性投注</div>
<script>
const d=[
{i:'001',t:'00:50',l:'沙职',h:'新未来SC',a:'利雅得青年',he:'🟢',ae:'⚪',p:'让球负（利雅得+1不败）',c:'⭐⭐⭐',o:'@1.85',heart:0,s:'2-1',r:'push',v:'主队2-1赢球，让球走盘。赛前看低主队，结果主场拿下。'},
{i:'002',t:'01:00',l:'瑞超',h:'天狼星',a:'厄格里特',he:'🔵',ae:'⚫',p:'让球平/让球负',c:'⭐⭐⭐',o:'@1.90',heart:0,s:'2-0',r:'push',v:'天狼星2-0完胜，让球平刚好走盘。客队未能守住指数。'},
{i:'003',t:'02:00',l:'沙职',h:'布赖代合作',a:'吉达国民',he:'🟡',ae:'🔴',p:'负（吉达国民客胜）',c:'⭐⭐⭐⭐',o:'@1.75',heart:1,s:'1-2',r:'win',v:'吉达国民客场2-1取胜，重心胆命中！实力占优兑现。'},
{i:'004',t:'02:45',l:'意甲',h:'那不勒斯',a:'博洛尼亚',he:'🔵',ae:'🔴',p:'胜（首选）/让球平',c:'⭐⭐⭐⭐⭐',o:'@1.65',heart:1,s:'2-3',r:'loss',v:'那不勒斯主场翻车！博洛尼亚客场3-2爆冷，重心胆黑掉。'},
{i:'005',t:'03:00',l:'英超',h:'热刺',a:'利兹联',he:'⚪',ae:'⚪',p:'让球平/让球负',c:'⭐⭐⭐',o:'@1.80',heart:0,s:'1-1',r:'push',v:'利兹联1-1逼平热刺，受让+1走水。判断客队能抢分，方向对但走盘。'},
{i:'006',t:'03:00',l:'英冠',h:'米尔沃尔',a:'赫尔城',he:'🔵',ae:'🟠',p:'让球胜/搏平',c:'⭐⭐⭐',o:'@1.90',heart:0,s:'0-2',r:'loss',v:'米尔沃尔0-2完败，推荐黑掉。主场优势未兑现，进攻端哑火。'},
{i:'007',t:'03:00',l:'西甲',h:'巴列卡诺',a:'赫罗纳',he:'⚪',ae:'🔴',p:'平（首选）/让球胜',c:'⭐⭐⭐',o:'@2.10',heart:0,s:'1-1',r:'win',v:'1-1平局命中！双方实力接近，巴列卡诺主场守平。'},
{i:'008',t:'03:15',l:'葡超',h:'里奥阿维',a:'葡萄牙体育',he:'🔴',ae:'🟢',p:'让球胜/搏平',c:'⭐⭐⭐',o:'@1.85',heart:0,s:'1-4',r:'loss',v:'里奥阿维1-4惨败，让球负黑掉。Sporting客场火力全开，实力碾压。'},
{i:'011',t:'01:00',l:'西甲',h:'塞尔塔',a:'莱万特',he:'🔵',ae:'🔵',p:'BTTS Yes',c:'⭐⭐⭐',o:'@1.75',heart:1,s:'-',r:'pending',v:'重心胆：塞尔塔中卫Starfelt缺阵，防线重组；莱万特保级拼命必反击。'},
{i:'012',t:'02:00',l:'西甲',h:'贝蒂斯',a:'埃尔切',he:'🟢',ae:'⚪',p:'BTTS Yes',c:'⭐⭐',o:'@1.65',heart:1,s:'-',r:'pending',v:'重心胆：贝蒂斯Bartra缺阵+Natan疑，中卫真空；埃尔切降级队有反击能力。'}
];
function render(x='all'){const g=document.getElementById('g');g.innerHTML='';let m=d;if(x==='heart')m=d.filter(z=>z.heart);if(x==='win')m=d.filter(z=>z.r==='win');if(x==='loss')m=d.filter(z=>z.r==='loss');if(x==='today')m=d.filter(z=>z.i>='011');m.forEach(z=>g.appendChild(card(z)));stats(m)}
function card(z){const c=document.createElement('div');c.className=`mc ${z.heart?'hrt':''}`;const bc=z.r==='win'?'w':z.r==='loss'?'l':z.r==='push'?'p':'d';const bt=z.r==='win'?'命中':z.r==='loss'?'黑掉':z.r==='push'?'走水':'待赛';c.innerHTML=`<div class="mh"><div class="mm"><span class="mt">${z.t}</span><span class="ml">${z.l}</span></div><span class="bd ${bc}">${bt}</span></div><div class="tm"><div class="t"><div class="tl">${z.he}</div><div class="tn">${z.h}</div></div><div class="sc">${z.s!=='-'?z.s:'<span style="color:var(--s)">VS</span>'}</div><div class="t r"><div class="tl">${z.ae}</div><div class="tn">${z.a}</div></div></div><div class="pd"><div class="pt">赛前推荐</div><div class="pc"><span class="tg m">${z.p}</span><span class="tg c">${z.c}</span><span class="tg o">${z.o}</span></div></div><div class="rv"><div class="rt">赛后复盘</div><div class="rx">${z.v}</div></div>`;return c}
function stats(m){const w=m.filter(z=>z.r==='win').length,l=m.filter(z=>z.r==='loss').length,p=m.filter(z=>z.r==='push').length,de=w+l;document.getElementById('w').textContent=w;document.getElementById('l').textContent=l;document.getElementById('p').textContent=p;document.getElementById('r').textContent=de>0?Math.round(w/de*100)+'%':'0%'}
function f(x){document.querySelectorAll('.fb').forEach(b=>b.classList.remove('a'));event.target.classList.add('a');render(x)}
render('all')
</script>
</body>
</html>
