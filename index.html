<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>777 扫盘中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0a0e1a;--card:#111827;--b:#1f2937;--t:#e5e7eb;--s:#9ca3af;--a:#3b82f6;--win:#10b981;--loss:#ef4444;--push:#f59e0b;--heart:#f43f5e}body{background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}.header{background:rgba(17,24,39,.8);border-bottom:1px solid var(--b);padding:16px 24px;position:sticky;top:0}.hi{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}.logo{display:flex;align-items:center;gap:12px}.li{width:40px;height:40px;background:var(--a);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}.lt h1{font-size:18px}.lt span{font-size:12px;color:var(--s)}.hs{display:flex;gap:24px}.si{text-align:center}.sv{font-size:20px;font-weight:700;color:var(--win)}.sv.l{color:var(--loss)}.sv.p{color:var(--push)}.sl{font-size:11px;color:var(--s)}.ctrl{max-width:1200px;margin:24px auto;padding:0 24px;display:flex;gap:12px}.fb{padding:8px 16px;border-radius:8px;border:1px solid var(--b);background:var(--card);color:var(--t);cursor:pointer}.fb:hover,.fb.a{border-color:var(--a);background:rgba(59,130,246,.2)}.main{max-width:1200px;margin:0 auto;padding:0 24px 48px}.st{font-size:14px;color:var(--s);margin-bottom:16px;display:flex;align-items:center;gap:8px}.st::before{content:"";display:inline-block;width:4px;height:16px;background:var(--a);border-radius:2px}.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}.mc{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:20px;position:relative;overflow:hidden}.mc:hover{border-color:var(--a)}.mc.hrt{border-color:var(--heart);box-shadow:0 0 20px rgba(244,63,94,.3)}.mc.hrt::before{content:'重心胆';position:absolute;top:12px;right:-28px;background:var(--heart);color:#fff;font-size:11px;font-weight:700;padding:4px 32px;transform:rotate(45deg)}.mh{display:flex;justify-content:space-between;margin-bottom:16px}.mm{display:flex;gap:8px;align-items:center}.mt{font-size:12px;color:var(--s);background:rgba(255,255,255,.05);padding:4px 8px;border-radius:4px}.ml{font-size:11px;color:var(--a);font-weight:600}.bd{padding:4px 12px;border-radius:6px;font-size:12px;font-weight:700}.bd.w{background:rgba(16,185,129,.15);color:var(--win)}.bd.l{background:rgba(239,68,68,.15);color:var(--loss)}.bd.p{background:rgba(245,158,11,.15);color:var(--push)}.bd.d{background:rgba(156,163,175,.15);color:var(--s)}.tm{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.tm .t{display:flex;align-items:center;gap:10px;flex:1}.tm .t.r{flex-direction:row-reverse;text-align:right}.tl{width:36px;height:36px;background:rgba(255,255,255,.05);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}.tn{font-size:14px;font-weight:600}.sc{font-size:24px;font-weight:700;text-align:center;min-width:80px}.pd{background:rgba(255,255,255,.03);border-radius:8px;padding:12px;margin-bottom:12px}.pt{font-size:11px;color:var(--s);margin-bottom:8px}.pc{display:flex;gap:8px;flex-wrap:wrap}.tg{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:600}.tg.m{background:rgba(59,130,246,.3);color:var(--a);border:1px solid var(--a)}.tg.c{background:rgba(255,255,255,.05);color:var(--s)}.tg.o{background:rgba(16,185,129,.1);color:var(--win)}.rv{border-top:1px solid var(--b);padding-top:12px}.rt{font-size:11px;color:var(--s);margin-bottom:8px}.rx{font-size:13px;line-height:1.6;color:var(--s)}.ft{text-align:center;padding:32px;color:var(--s);font-size:12px;border-top:1px solid var(--b)}.loading{text-align:center;padding:48px;color:var(--s);font-size:14px}.error{text-align:center;padding:48px;color:var(--loss);font-size:14px}.date-section{margin-bottom:32px}.date-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--b)}.date-label{font-size:16px;font-weight:700;color:var(--t)}.date-count{font-size:12px;color:var(--s);background:rgba(255,255,255,.05);padding:2px 8px;border-radius:4px}@media(max-width:768px){.mg{grid-template-columns:1fr}.hs{display:none}}
</style>
</head>
<body>
<header class="header"><div class="hi"><div class="logo"><div class="li">⚽</div><div class="lt"><h1>777 扫盘中心</h1><span>Football Scan & Review</span></div></div><div class="hs"><div class="si"><div class="sv" id="w">0</div><div class="sl">命中</div></div><div class="si"><div class="sv l" id="l">0</div><div class="sl">黑掉</div></div><div class="si"><div class="sv p" id="p">0</div><div class="sl">走水</div></div><div class="si"><div class="sv" id="r">0%</div><div class="sl">命中率</div></div></div></div></header>
<div class="ctrl"><button class="fb a" onclick="f('all')">全部</button><button class="fb" onclick="f('heart')">重心胆</button><button class="fb" onclick="f('win')">命中</button><button class="fb" onclick="f('loss')">黑掉</button><button class="fb" onclick="f('today')">今日</button><button class="fb" onclick="reloadData()" style="margin-left:auto;background:rgba(16,185,129,.2);color:var(--win)">🔄 刷新数据</button></div>
<main class="main" id="main"><div class="loading">⏳ 正在加载数据...</div></main>
<div class="ft">777 扫盘系统 | 数据驱动决策 | 理性投注<br><span id="sync-info" style="color:var(--s);font-size:10px;margin-top:4px;display:block">同步来源: 飞书多维表格 | 上次更新: 加载中...</span></div>
<script>
let rawData=[],flatMatches=[];
function render(filter='all'){
  const main=document.getElementById('main');main.innerHTML='';
  let groups=JSON.parse(JSON.stringify(rawData));
  if(filter==='heart')groups.forEach(g=>g.items=g.items.filter(z=>z.isHeart));
  if(filter==='win')groups.forEach(g=>g.items=g.items.filter(z=>z.result==='win'));
  if(filter==='loss')groups.forEach(g=>g.items=g.items.filter(z=>z.result==='loss'));
  if(filter==='today')groups=groups.filter(g=>g.date>='2026-05-12');
  groups.forEach(g=>{if(g.items.length>0)main.appendChild(section(g))});
  const allItems=groups.flatMap(g=>g.items);stats(allItems);
  if(main.innerHTML==='')main.innerHTML='<div class="loading">📭 该筛选条件下暂无比赛</div>';
}
function section(g){
  const sec=document.createElement('div');sec.className='date-section';
  const header=document.createElement('div');header.className='date-header';
  const dateStr=g.date.replace(/-/g,'.');
  const label=g.date==='2026-05-12'?'今日推荐':g.date==='2026-05-11'?'昨日复盘':dateStr+' 赛程';
  header.innerHTML='<span class="date-label">'+label+'</span><span class="date-count">'+g.items.length+' 场</span>';
  sec.appendChild(header);
  const grid=document.createElement('div');grid.className='mg';
  g.items.forEach(z=>grid.appendChild(card(z)));
  sec.appendChild(grid);return sec;
}
function card(z){
  const c=document.createElement('div');c.className='mc'+(z.isHeart?' hrt':'');
  const bc=z.result==='win'?'w':z.result==='loss'?'l':z.result==='push'?'p':'d';
  const bt=z.result==='win'?'命中':z.result==='loss'?'黑掉':z.result==='push'?'走水':'待赛';
  c.innerHTML='<div class="mh"><div class="mm"><span class="mt">'+z.time+'</span><span class="ml">'+z.league+'</span></div><span class="bd '+bc+'">'+bt+'</span></div><div class="tm"><div class="t"><div class="tl">'+z.homeEmoji+'</div><div class="tn">'+z.home+'</div></div><div class="sc">'+(z.score!=='-'?z.score:'<span style="color:var(--s)">VS</span>')+'</div><div class="t r"><div class="tl">'+z.awayEmoji+'</div><div class="tn">'+z.away+'</div></div></div><div class="pd"><div class="pt">赛前推荐</div><div class="pc"><span class="tg m">'+z.prediction+'</span><span class="tg c">'+z.confidence+'</span><span class="tg o">'+z.odds+'</span></div></div><div class="rv"><div class="rt">赛后复盘</div><div class="rx">'+z.review+'</div></div>';
  return c;
}
function stats(m){
  const w=m.filter(z=>z.result==='win').length,l=m.filter(z=>z.result==='loss').length,p=m.filter(z=>z.result==='push').length,de=w+l;
  document.getElementById('w').textContent=w;document.getElementById('l').textContent=l;document.getElementById('p').textContent=p;
  document.getElementById('r').textContent=de>0?Math.round(w/de*100)+'%':'0%';
}
function f(x){document.querySelectorAll('.fb').forEach(b=>b.classList.remove('a'));event.target.classList.add('a');render(x);}
function reloadData(){
  document.getElementById('main').innerHTML='<div class="loading">⏳ 正在刷新数据...</div>';
  fetch('data.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(d=>{
    rawData=d.matches||[];
    flatMatches=rawData.flatMap(g=>g.items);
    render('all');
    const info=document.getElementById('sync-info');
    if(info&&d.lastUpdated){const dt=new Date(d.lastUpdated);info.textContent='同步来源: '+(d.source||'本地')+' | 上次更新: '+dt.toLocaleString('zh-CN');}
    alert('✅ 数据已刷新！');
  }).catch(e=>{document.getElementById('main').innerHTML='<div class="error">❌ 数据刷新失败: '+e.message+'</div>';console.error(e);});
}
fetch('data.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(d=>{rawData=d.matches||[];flatMatches=rawData.flatMap(g=>g.items);render('all');const info=document.getElementById('sync-info');if(info&&d.lastUpdated){const dt=new Date(d.lastUpdated);info.textContent='同步来源: '+(d.source||'本地')+' | 上次更新: '+dt.toLocaleString('zh-CN');}}).catch(e=>{document.getElementById('main').innerHTML='<div class="error">❌ 数据加载失败: '+e.message+'</div>';console.error(e);});
</script>
</body>
</html>
